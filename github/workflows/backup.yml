# ============================================================
# Backup automático semanal de la base de datos de Supabase
#
# CÓMO INSTALARLO:
# 1. En tu repositorio de GitHub, creá la carpeta .github/workflows/
#    (si no existe) y guardá este archivo ahí como "backup.yml"
# 2. En GitHub: Settings del repo → Secrets and variables → Actions
#    → "New repository secret":
#       Nombre:  SUPABASE_DB_URL
#       Valor:   la "Connection string" de tu proyecto (la sacás en
#                Supabase → Project Settings → Database → Connection
#                string → modo "URI"). Usá la que dice "Session pooler"
#                o la directa, cualquiera de las dos sirve para esto.
# 3. Listo. Corre solo todos los domingos a las 4am (hora Argentina).
#    También podés ejecutarlo manualmente desde la pestaña "Actions"
#    de GitHub cuando quieras, con el botón "Run workflow".
#
# DÓNDE QUEDA LA COPIA:
# En la pestaña "Actions" de GitHub, entrando a la ejecución del
# backup, abajo del todo hay una sección "Artifacts" con el archivo
# .sql para descargar. Se guardan las últimas 12 semanas (90 días).
# ============================================================

name: Backup Supabase

on:
  schedule:
    - cron: "0 7 * * 0"   # domingos 7:00 UTC = 4:00 AM Argentina
  workflow_dispatch: {}    # permite tocar "Run workflow" a mano

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de PostgreSQL
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Generar nombre de archivo con fecha
        run: echo "FILENAME=backup-$(date +%Y-%m-%d).sql" >> $GITHUB_ENV

      - name: Exportar la base de datos completa
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: pg_dump "$DB_URL" --no-owner --no-privileges -F p -f "${{ env.FILENAME }}"

      - name: Guardar la copia como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILENAME }}
          path: ${{ env.FILENAME }}
          retention-days: 90
